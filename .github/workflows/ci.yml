name: CI

# 什么时候跑：
#   · 往 master 推代码
#   · 有人（包括我自己）提 PR 到 master
# 手动触发也留一个入口，方便在 Actions 页面点一下重跑
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: 构建 · 测试 · 覆盖率
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # JDK 版本必须和 pom.xml 里的 <java.version>17</java.version> 一致，
      # 否则会出现"本机没问题、CI 编译不过"这种最难查的差异
      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          # 把 ~/.m2 缓存起来，第二次之后的构建不用重新下依赖
          cache: maven

      # mvnw 是仓库自带的 Maven Wrapper（distributionType=only-script，
      # 不需要额外的 maven-wrapper.jar），用它而不是固定的 mvn，
      # 可以保证 CI 和本机用的是同一个 Maven 版本（3.9.16）
      #
      # verify 而不是 test：JaCoCo 的报告绑定在 verify 阶段，
      # 用 test 只会跑测试、不会产出覆盖率报告
      #
      # 【不需要在这里起 MySQL / Redis】
      # 测试自己用 Testcontainers 拉起容器（见 AbstractIntegrationTest）。
      # GitHub 的 ubuntu runner 自带 Docker，所以这一步开箱可用，
      # 这也正是前面把测试容器化的意义 —— 否则这里还得写一段
      # services: mysql/redis 的编排，而且和本机环境会有差异
      - name: 构建并运行测试（含覆盖率）
        run: ./mvnw -B verify

      # 上传报告时加 if: always()，因为测试失败时报告恰恰是最需要看的
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn
