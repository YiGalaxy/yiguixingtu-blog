services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: yiguixingtu_blog
      MYSQL_USER: blog
      MYSQL_PASSWORD: blog-local-password
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3311:3306"
    volumes:
      - blog_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ublog", "-pblog-local-password"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  blog_mysql:
