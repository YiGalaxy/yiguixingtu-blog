# =====================================================================
# 亿轨星途 —— Nginx 站点配置
# =====================================================================

# ---------- 限流：按客户端 IP 记令牌桶（只能定义在 http 层） ----------
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# ---------- 80：只做跳转，并给 certbot 续期留一条路 ----------
server {
    listen 80;
    server_name www.yigalaxy.xin yigalaxy.xin 47.109.182.255;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.yigalaxy.xin$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name yigalaxy.xin;

    ssl_certificate     /etc/letsencrypt/live/www.yigalaxy.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.yigalaxy.xin/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://www.yigalaxy.xin$request_uri;
}

server {
    listen 443 ssl;
    server_name www.yigalaxy.xin;

    ssl_certificate     /etc/letsencrypt/live/www.yigalaxy.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.yigalaxy.xin/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Nginx 默认只允许 1MB 的请求体，而前端允许封面图 5MB、音频 20MB。
    # 不改这条，超过 1MB 的上传会在还没到后端时被 413 拒掉，后端日志里什么都没有。
    client_max_body_size 110m;

    # IndexNow ownership file is public and persists across frontend deployments.
    location = /d4912ba7f85d4b24b5f09d69341c28a6.txt {
        root /var/www/indexnow;
        default_type text/plain;
        try_files $uri =404;
    }

    # ---------- 前端（Nuxt SSR 容器） ----------
    # /sitemap.xml、/robots.txt、/feed.xml 是运行时路由，不能配成 try_files 发磁盘文件
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 后端接口 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
    }

    # ---------- 管理端点：必须显式挡掉 ----------
    # /api/ 的 proxy_pass 结尾带 /，会把 /api/actuator/xxx 拼成后端根路径 /actuator/xxx，
    # 而后端那个端点对匿名是放行的 ⇒ 不挡就是公网能读 JVM / 连接池 / 接口调用量
    location /api/actuator/ {
        return 404;
    }

    # ---------- 上传的图片 ----------
    location /api/uploads/ {
        proxy_pass http://127.0.0.1:8082/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 刻意不加 limit_req：一篇带 10 张图的文章打开一次就是 10 个请求
        proxy_hide_header Cache-Control;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ---------- 背景视频 / 音乐：Nginx 直接发文件 ----------
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # 刻意不加 limit_req：video/audio 按 Range 分段拉，一次播放几十个请求
    }

    # ---------- 登录接口：更严的桶 ----------
    location = /api/auth/login {
        proxy_pass http://127.0.0.1:8082/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
    }
}
