# =====================================================================
# 生产环境编排（四个容器：backend + frontend + mysql + redis）
#
# 【⚠️ 必须给它一个独立项目名（name），这是踩过坑才加的】
#   compose 默认用【目录名】当项目名，而 docker-compose.yaml（本地开发）
#   和本文件在同一个目录 —— 于是两者会被当成【同一个项目】。
#   后果非常危险：执行本文件的 up 会把本地开发的那两个容器
#   "当成自己的"去接管/改动（实测确实发生了：mysql 被直接接管并加了健康检查），
#   本地环境会在你不知情的情况下被改掉。
#   加上 name: yiguixingtu-prod 之后，两套编排彻底分开，可以并存、互不干扰。
#   （同理，下面每个服务的 container_name 都带了 -prod 后缀，避免与本地重名）
#
# 【和 docker-compose.yaml（本地开发用）有什么区别，为什么不合成一个】
#   两者的目标不同，硬合在一起会互相拖累：
#
#   | | docker-compose.yaml（本地） | 这个文件（生产） |
#   |---|---|---|
#   | 有哪些服务 | 只有 mysql + redis | backend + mysql + redis |
#   | 数据库端口 | **映射到宿主机**（3310/6380，方便本地用客户端连） | **完全不映射**（只在容器内网可达） |
#   | 数据库密码 | 明文 root/root，为了开箱即用 | 必须由环境变量注入 |
#   | 健康检查 | 没有 | 四个服务都有，backend 依赖 mysql / redis healthy 才启动 |
#   | 自动重启 | 没有 | restart: unless-stopped |
#
#   尤其"数据库端口不映射"这一条：生产环境把 3306 暴露到公网
#   是最常见的被拖库原因之一。这里不写 ports，容器之间通过
#   compose 自动创建的内网用服务名（mysql / redis）互相访问，
#   外网根本连不到它们。
#
# 【怎么用】
#   1. 先准备一个 .env 文件（和本文件同目录），内容见下方注释
#   2. docker compose -f docker-compose.prod.yaml up -d --build
#   3. docker compose -f docker-compose.prod.yaml ps   # 四个都应是 healthy
#
# 【.env 要准备什么】（⚠️ 这个文件不要提交）
#   MYSQL_ROOT_PASSWORD=一个强密码
#   DB_PASSWORD=一个强密码            # 业务账号的密码（可以和 root 不同）
#   REDIS_PASSWORD=一个强密码
#   JWT_SECRET=至少32字节的随机串
#   CORS_ALLOWED_ORIGINS=https://你的域名
#   PUBLIC_API_BASE=https://你的域名/api   # 浏览器访问后端的地址
#   BOOTSTRAP_ADMIN_USERNAME=你的管理员账号
#   BOOTSTRAP_ADMIN_PASSWORD=一个强密码
#   可选：FRONTEND_DIR（前端仓库路径，默认 ../yiguixingtu-web）
#         BACKEND_PORT / FRONTEND_PORT（默认 8082 / 3000）
# =====================================================================

# 独立项目名：与本地开发的 docker-compose.yaml 彻底分开（原因见上）
name: yiguixingtu-prod

# =====================================================================
# 容器日志轮转（四个服务共用同一份配置）
#
# 【为什么必须配 —— 不配的话它会在某一天悄悄把服务器磁盘写满】
#   Docker 默认的日志驱动是 json-file，而且**默认不轮转**：
#   `/var/lib/docker/containers/<id>/<id>-json.log` 会一直长下去。
#   而我们的应用恰恰是"会持续打日志"的那种：
#     · 后端每次请求都有访问日志，还有审计、定时任务、SQL（prod 已关）等
#     · Nginx 那层已经单独配了 access_log，但容器里的是另一份
#   一台 40GB 盘的 ECS，如果 MySQL 慢查询日志 + 容器日志都不管，
#   几个月后就是"数据库写不进去、容器起不来"，而且错误信息不会指向日志。
#
# 【为什么是 10m × 3】
#   每个容器最多留 30MB（四个服务合计上限 120MB），既能装下最近一段时间的排查信息，
#   又不会因为"日志太重要"而无限增长。真需要长期保留的是**审计表**
#   （operation_log，结构化、可查询），不是这些文本日志 ——
#   把两者的职责分开，才不会指望日志文件当审计用。
#
# 【为什么用 YAML 锚点】四个服务要配一模一样的东西，
#   复制四遍的话，哪天改了一处就会漏掉另三处；锚点让"只有一份定义"。
# =====================================================================
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# =====================================================================
# 内存预算 —— 按【实测】1638MB（标称"2 核 2G"，但内核只看到 1.6Gi）定的，
# 四个服务的 mem_limit 都出自这张表
#
# 【为什么必须给容器设上限：MaxRAMPercentage 读的是【宿主机】内存】
#   JVM 的"容器感知"只认 cgroup 限额。不设 mem_limit 时容器【没有限额】，
#   它看到的就是宿主机的那几个 G，于是百分比会算出"堆可以到 1.2G"——
#   一台 2G 的机器上，这意味着后端 + MySQL + Redis + Node 的峰值必然超过物理内存，
#   最后由内核的 OOM killer 出手，而它挑的通常是 RSS 最大的那个（**MySQL**）。
#   症状是"数据库莫名重启、连接全断"，而且应用日志里什么都看不到
#   （要看 `dmesg` 才知道是 OOM）。
#   设了上限之后，越界只会杀掉【越界的那一个】容器，其余服务不受影响，
#   再配合 restart: unless-stopped 把它拉回来 —— 故障范围被限制在一个容器里。
#
# 【预算表】（宿主机【实测】1638MB —— 见下面那条 ⚠️）
#   | 服务     | 上限  | 预估实占 | 主要构成                               |
#   |----------|-------|---------|----------------------------------------|
#   | mysql    | 384m  | ~280MB  | 缓冲池 128M + 连接与线程                |
#   | backend  | 640m  | ~500MB  | 堆 ~384M + 元空间 + 线程栈 + 直接内存    |
#   | frontend | 240m  | ~180MB  | Node SSR 的常驻内存                     |
#   | redis    | 96m   | ~20MB   | maxmemory 64M（实际只用到十几 MB）      |
#   | 合计     | 1360m |         | 余 ~278MB 给系统 + Docker + Nginx       |
#
# 【⚠️⚠️ 为什么基数写 1638 而不是 2048 —— 这一条是整套参数的地基】
#   实例标称"2 核 2G"，但这台机器上 `free -h` 显示 `Mem: 1.6Gi`（≈1638MB）：
#   内核并不拥有标称的全部物理内存（虚拟化层与内核自身会占掉一部分）。
#   按标称的 2048 去分配，会算出一份"四个容器上限之和 1728m、余 320m"的表 ——
#   看着合理，实际上【上限之和已经超过物理内存 90MB】。而"上限之和必须给系统留余量"
#   这条不变式恰恰是用来防这件事的，基数用错就等于一条永远会通过的假测试。
#   ⇒ 结论：**内存预算必须按实测值算，不能按标称值算**。
#     换机器时先跑 `free -m`，再回来改这一节。
#
# 【⚠️ 上限之和刻意【不】顶满，别去"把内存用完"】
#   操作系统、Docker 守护进程、Nginx、sshd 自身也要内存，而它们不在这个文件里。
#   把容器上限之和顶到物理内存，等于把"谁先被 OOM"交给内核随机决定 ——
#   留出的这一档（这里约 278MB），就是给这些"不在 compose 里但确实在跑"的东西的。
#
# 【已验证的部分（不是纸面估算）】
#   · mysql：容器 512m 下从【空数据目录初始化】成功（mysql 8.4.11），
#     实测占用 197MB，OOMKilled=false；
#     performance_schema=0、innodb_buffer_pool_size=128M、max_connections=50 三项均实测生效。
#     ⚠️ 那次是在【更大的上限】下量的，现在收紧到 384m ——
#     按"缓冲池 128M + 其余约 150M"估约 280MB，仍有余量，但 384m 这一版没有再量过。
#     万一 MySQL 容器反复重启、`docker inspect` 的 ExitCode 是 137、dmesg 里有 oom-kill，
#     就把 mysql 提到 448m、同时把 backend 降到 576m（总量维持不变，不要加总预算）。
#   · redis：容器下启动正常，实测 maxmemory 与 maxmemory-policy 都生效
#   · backend 的 JVM 参数：以 --memory 实测过"堆正是上限的 60%、元空间与直接内存的上限
#     都生效、gc.log 正常生成"，详见 backend 服务里那段注释
#   · frontend 的 ~180MB 是唯一没有实测的一项（没在本机起 SSR 容器量过）
#
#
# 【宿主机侧还要做的一件事：4G swap —— 这里没有对应配置项，所以写在这里免得漏】
#   compose 不写 memswap_limit 时，Docker 默认允许容器使用
#   "内存上限 + 等量 swap"。四个容器加起来最坏是 384+640+240+96 = **1360M swap**，
#   4G 的 swapfile 能把最坏情况整个接住（还留了很大余量 —— 构建时的峰值也在用它）。
#   swap 上的内存很慢，但"慢"远好于"被 OOM 杀掉"。
#   （顺带一个反直觉的点：swap 不是"内存够就不用配"——它在这里的作用是
#     给内存上限兜底，让容器即使在峰值也只会变慢、不会被杀。）
#
# 【换机器时怎么调】先 `free -m` 拿到实测内存，再按同一张表的比例放大：
#   主要改这四个 mem_limit；backend 的堆是百分比会自动跟着走，
#   但 mysql 的 innodb-buffer-pool-size 是绝对值、要一起改
#   （而且必须是 128M 的整数倍，理由见下面 mysql 的 command 那一段）。
# =====================================================================

services:

  # -------------------------------------------------------------------
  # MySQL
  # -------------------------------------------------------------------
  mysql:
    # ⚠️ 钉住 minor 版本（8.4），不写浮动的 `mysql:8`
    #   【为什么】浮动标签会静默换版本，而 MySQL 的版本不是"换个镜像就行"：
    #   数据目录一旦被某个版本建出来，跨 minor 升级有官方的路径要求
    #   （8.0 → 8.4 要先升到最新的 8.0.x）。钉住 minor 之后：
    #     · 同一个 minor 内的补丁升级照常能拿到（原地兼容）
    #     · 不会被悄悄换到另一个 minor —— 而那种切换在数据目录已存在时可能直接起不来
    #   这条不是纸上推导：部署前实测过一个浮动 `mysql:8` 的镜像，
    #   拉下来竟是 Ver 8.0.27（2021-10 的版本，缺四年多的安全补丁）。
    #   升级办法见 README 的「升级流程」：改这里的版本号、pull 新镜像、
    #   按 MySQL 的升级路径走（小版本内可以直接换）。
    image: mysql:8.4
    container_name: yiguixingtu-prod-mysql
    # 内存上限 384M（预算表与理由见文件顶部「内存预算」）
    mem_limit: 384m
    environment:
      MYSQL_DATABASE: yiguixingtu
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须在 .env 里设置 MYSQL_ROOT_PASSWORD}
      # 单独建一个业务账号，而不是让应用用 root 连库 ——
      # 这是最小权限原则：应用只需要读写这一个库，用 root 等于给了它改整个实例的权限
      MYSQL_USER: yiguixingtu
      MYSQL_PASSWORD: ${DB_PASSWORD:?必须在 .env 里设置 DB_PASSWORD}
    # ⚠️ 【刻意不写 ports】—— 不把 3306 暴露到宿主机/公网。
    #    容器之间用服务名 mysql 互相访问，不需要对外开端口。
    # ------------------------------------------------------------------
    # 慢查询日志（与 docker-compose.yaml 里的参数保持一致，两边行为一样）
    #
    # 【为什么是 command 参数，不是挂 .cnf 文件 —— 这个坑值得记一笔】
    #   最初的写法是写一个 slow.cnf 再 bind mount 到 /etc/mysql/conf.d/，
    #   结果配置【完全没生效】，日志里只有一行极易忽略的警告：
    #       [Warning] World-writable config file '...' is ignored.
    #   MySQL 会主动忽略权限为 777 的配置文件（能被别人改的配置 =
    #   能被别人改数据库行为）。而 Windows 文件系统没有 POSIX 权限，
    #   bind mount 进去一律是 777，于是必然被忽略。
    #   危险之处在于：Linux 服务器上是好的，只有本机 Windows 静默失效。
    #   换成命令行参数后，权限语义不再参与，两个平台行为一致。
    #
    # 【为什么线上也一定要开这个日志】
    #   官方默认 slow_query_log=OFF、long_query_time=10s ——
    #   等于没有慢查询记录。本项目优化掉的那条列表查询优化前 183ms，
    #   在默认配置下永远不可能出现在任何日志里。
    #   线上出问题时，能拿到"当时哪条 SQL 慢、扫了多少行"是排查的前提。
    # ------------------------------------------------------------------
    command:
      - mysqld
      - --slow-query-log=ON
      # 放数据目录（具名卷）里，容器重建日志不丢
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --long-query-time=0.1
      - --log-output=FILE
      # ------------------------------------------------------------------
      # 以下是"2 核 2G"这个规格专用的内存参数（预算表见文件顶部「内存预算」）
      #
      # 【为什么 performance_schema 要关掉：这是这个规格下最划算的一刀】
      #   它默认是【开】的，自己就要占 100~200MB —— 相当于一个 2G 机器上
      #   凭空少了一成的内存。它记录的是"每条语句在等什么锁、每个阶段花多久"，
      #   这是给 DBA 做性能诊断用的；对一个单人博客来说完全用不上。
      #   ⚠️ 代价要说清楚：关掉之后 performance_schema 与 sys 库下的诊断视图不可用。
      #      但本项目真正依赖的性能数据是【慢查询日志】（上面那三行），
      #      它不依赖 performance_schema，所以排查能力并没有丢。
      - --performance-schema=OFF
      # InnoDB 缓冲池：128M。
      #   【为什么是 128M】本站的数据量是"几 MB 的文章正文 + 几 MB 的评论"，
      #   128M 足以把全部热数据装进内存（那条 183ms → 0.11ms 的覆盖索引查询
      #   依赖的也只是索引页常驻），再多就是白占。
      #
      #   ⚠️ 【为什么不是 192M —— 这个数是实测踩出来的，记下来免得再踩】
      #   MySQL 会把缓冲池【向上取整】到 innodb_buffer_pool_chunk_size 的整数倍，
      #   而那个 chunk 默认就是 128M。于是：
      #     --innodb-buffer-pool-size=192M → 实际生效 256M
      #        （实测 @@innodb_buffer_pool_size = 268435456，白白多占 64M 物理内存，
      #          而且【不报错、不警告】，只在读变量时才能发现）
      #     --innodb-buffer-pool-size=128M → 实际生效 128M
      #        （实测 134217728，正是想要的；chunk_size 实测也是 134217728）
      #   在 2G 的机器上，"写 192 得 256"这种静默取整不能不管。
      #   ⇒ 取值应当是 128M 的整数倍（除非连 chunk size 一起改）。
      #   测试里有一条用例盯着这一点（DeploymentMemoryBudgetTest#mysqlMustCapItsOwnMemory）。
      - --innodb-buffer-pool-size=128M
      # 连接数上限：默认 151。每一条连接在服务端都占线程与排序缓冲，
      #   而应用侧的 HikariCP 池最多只要 6 条（见 backend 的 DB_POOL_SIZE）。
      #   留 50 是给"运维手工连库排查"用的，绰绰有余。
      - --max-connections=50
    volumes:
      # 具名卷：容器删了数据还在（docker compose down 不会删卷，加 -v 才会）。
      # 慢查询日志也写在这个目录里，所以它同样不会随容器重建而丢失。
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 健康检查决定"backend 什么时候可以启动"。
      # 用 mysqladmin ping：mysqld 端口开了不代表能接受查询，
      # 这个命令是真正连上去问一句，更可靠。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      # start_period 里的失败【不算】失败次数：MySQL 首次初始化数据目录要几十秒，
      # 不给这个宽限期的话，容器还没初始化完就被判定 unhealthy
      start_period: 40s
    # 日志轮转：与其它服务共用 x-logging 锚点（上限 10m × 3，见文件顶部说明）
    logging: *default-logging
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Redis
  # -------------------------------------------------------------------
  redis:
    # ⚠️ 同样钉住 minor 版本（7.4），不写浮动的 `redis:7`
    #   【它和 MySQL 那条的理由不完全相同，说清楚】Redis 里存的全是【可重建】的东西
    #   （缓存条目、浏览量增量、版本号计数器、token 黑名单），所以"版本被悄悄换掉"
    #   的后果顶多是缓存冷启动，不像 MySQL 那样可能直接起不来。
    #   钉它的理由是【可复现】：部署时跑的是哪个版本应当是确定的、写在这里的，
    #   而不是"某天 pull 到了什么就是什么"。而且它没发布端口、只在 compose 内网可达，
    #   补丁升级的紧迫性也低 —— 要升就显式改这一行。
    image: redis:7.4
    container_name: yiguixingtu-prod-redis
    # 内存上限 96M（预算表与理由见文件顶部「内存预算」）
    mem_limit: 96m
    environment:
      # 【为什么要把密码也放进 environment，明明 command 里已经用了】
      #   因为下面的健康检查需要它。踩过一次：一开始只在 command 里用
      #   ${REDIS_PASSWORD} 设密码，没往容器里注入这个环境变量，
      #   结果健康检查里 `redis-cli -a $$REDIS_PASSWORD` 里的变量是【空的】，
      #   认证失败 → 容器一直被判定 unhealthy → backend 因依赖它而根本不启动。
      #   表现是"redis 明明在跑却 unhealthy"，很容易误判成 redis 本身有问题。
      REDIS_PASSWORD: ${REDIS_PASSWORD:?必须在 .env 里设置 REDIS_PASSWORD}
    # 用密码启动；--appendonly yes 打开 AOF 持久化，
    # 这样容器重启后缓存不至于全丢（虽然缓存丢了也能自愈，但频繁冷启动会压数据库）
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?必须在 .env 里设置 REDIS_PASSWORD}
      - --appendonly
      - "yes"
      # ------------------------------------------------------------------
      # 以下是"2 核 2G"这个规格专用的内存参数（预算表见文件顶部「内存预算」）
      #
      # maxmemory：Redis 默认【不限内存】，这台机器上必须给它一个天花板 ——
      #   否则"缓存"这种东西会在内存紧张时反过来变成压垮系统的那一个。
      #   本站的实际用量是十几 MB 量级（几百条缓存条目 + 浏览量增量 + 版本号），
      #   64MB 是给得很宽裕的保险丝，正常永远碰不到。
      #   ⚠️ 它必须【小于】上面的 mem_limit（96m）—— 大于等于的话等于没有上限：
      #      Redis 会在自己还没到 maxmemory 的时候就被 cgroup 杀掉。测试里有用例盯着。
      - --maxmemory
      - 64mb
      # 【⚠️ 为什么是 volatile-lru 而不是 allkeys-lru —— 这一条是特意选的】
      #   本项目在 Redis 里存了【两类"丢了就真丢数据"的 key，而它们都没有 TTL】：
      #     · article:view:*  —— 文章浏览量的待落库增量，由定时任务每 5 分钟取走一次
      #                          （见 ArticleViewCounter）。被淘汰 = 这 5 分钟里的浏览白记了，
      #                          而且是静默丢失，事后查不出来。
      #     · 两个缓存版本号计数器（article:page:version / content:list:version）——
      #                          被淘汰则版本号从 0 重来，不会出错，但会让全部缓存白白重建。
      #   allkeys-lru 会把上面这些一起淘汰；volatile-lru 只淘汰【带 TTL 的】，
      #   而那正好是 Spring 缓存的那批条目（TTL 5 分钟 / 60 秒 / 30 秒 + 抖动），
      #   它们本来就是"随时可以重新查库重建"的东西。
      #   ⇒ "淘汰可重建的、保住不可重建的"，这就是选它的全部理由。
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      # 设了密码之后，redis-cli ping 必须带 -a，否则会收到 NOAUTH 错误
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # 日志轮转：与其它服务共用 x-logging 锚点（上限 10m × 3，见文件顶部说明）
    logging: *default-logging
    restart: unless-stopped

  # -------------------------------------------------------------------
  # 后端应用
  # -------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yiguixingtu-prod-backend
    # 内存上限 640M。
    # ⚠️ 这一行和下面 JAVA_TOOL_OPTIONS 里的 MaxRAMPercentage 是【同一个决定的两半】：
    #    JVM 按"这个上限"算堆（60% ≈ 384M），改一个必须同时看另一个。
    #    （预算表与理由见文件顶部「内存预算」）
    mem_limit: 640m
    depends_on:
      # 【condition: service_healthy 是关键】
      #   只写 depends_on: [mysql] 的话，compose 只保证"容器启动了"，
      #   而 MySQL 启动到能接受连接之间还有几十秒。
      #   应用这时候去连库会失败，Flyway 直接报错，容器退出。
      #   加上 service_healthy 之后，compose 会等健康检查通过才启动 backend。
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 激活生产配置（对应 application-prod.properties）
      SPRING_PROFILES_ACTIVE: prod
      # 数据库地址用【服务名】mysql，不是 localhost ——
      # 容器各有自己的网络命名空间，localhost 指的是容器自己。
      # 这个坑很常见：本地用 localhost 好好的，一进 compose 就连不上。
      DB_URL: jdbc:mysql://mysql:3306/yiguixingtu?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: yiguixingtu
      DB_PASSWORD: ${DB_PASSWORD:?必须在 .env 里设置 DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?必须在 .env 里设置 REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?必须在 .env 里设置 JWT_SECRET（至少32字节）}
      # 前端域名：上线必须改，否则浏览器会跨域失败
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?必须在 .env 里设置 CORS_ALLOWED_ORIGINS（前端域名）}
      # 管理员初始化引导：库里没有管理员时，第一次启动自动建一个
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NICKNAME: ${BOOTSTRAP_ADMIN_NICKNAME:-站长}
      # ---- 封面上传：存在【这台服务器】的磁盘上，不用对象存储 ----
      # 为什么不用 OSS：单台 ECS + 个人博客的量级，本地磁盘完全够用，
      # 少一个外部依赖就少一处会失败的地方（网络、密钥、配额、计费）。
      # 什么时候该换：图片多到磁盘吃紧、或者将来要上多台机器做负载均衡
      # （多实例时本地磁盘就不共享了，那时必须换成对象存储或共享盘）。
      # 【为什么这里没有 storage=oss 之类的开关】项目已经把整套 OSS 实现删掉了，
      # 现在只有本地磁盘一种存储（见 README「文件上传」章节的取舍说明）。
      # 【为什么目录必须写成 /app/uploads】
      #   它是下面 volumes 里挂载点的路径。写错的话文件会落到容器自己的
      #   可写层里 —— 容器一重建（docker compose up -d --build 就会重建）
      #   用户上传的所有封面图【全部消失】，而且不会有任何报错。
      UPLOAD_LOCAL_DIR: /app/uploads
      # 【图片的对外地址前缀，必须和浏览器看到的地址一致】
      #   本地存储返回的 URL 形如 {base-url}/uploads/xxx.jpg，
      #   所以这里要填"浏览器能访问到后端 /uploads/** 的那个前缀"。
      #   直接复用 PUBLIC_API_BASE（Nginx 把 /api/ 反代到后端根路径），
      #   这样两者天然一致 —— 分开填两个变量最容易出现"有一个忘了改"。
      UPLOAD_BASE_URL: ${PUBLIC_API_BASE:?必须在 .env 里设置 PUBLIC_API_BASE（浏览器访问后端的地址）}
      # ---- 日志目录 ----
      # logback-spring.xml 里用的是 ${LOG_DIR:-logs}，默认写在容器工作目录下的 logs/ ——
      # 那是容器的【可写层】：容器一重建（改配置、升级版本、up -d --build 都会重建）
      # 日志就全没了，于是"按天滚动 + 保留 15 天"这句在生产上其实是空话。
      # 指到 /app/logs（下面挂了具名卷）之后，"15 天"才真的成立，
      # 升级重启之后也还能回头查上周的日志。
      LOG_DIR: /app/logs
      # ---- 容器日志轮转的补充说明 ----
      # 上面那段 x-logging 管的是【stdout】（docker logs 能看到的那些），
      # 这里是【应用自己写的文件日志】。两者都留着是有意的：
      #   · stdout  → 出问题第一眼要看的东西，docker logs 直接给
      #   · 文件    → 按天滚动、保留 15 天，能回头查"上周那次是几点开始的"
      # 只留 stdout 的话受 30MB 轮转限制，翻不了那么久；只留文件的话
      # 排查时要先进容器。两条路都留着，代价只是几十 MB。

      # ------------------------------------------------------------------
      # 内存与并发：与上面 mem_limit 配套的一组旋钮
      # （预算表与理由见文件顶部「内存预算」）
      #
      # 【为什么 JVM 参数写在这里，而不是 Dockerfile 的 ENTRYPOINT 里】
      #   它们是同一个决定的两半：MaxRAMPercentage 是"按容器内存上限的比例算堆"，
      #   而"容器内存上限"就是上面的 mem_limit。分居两个文件时，
      #   把 mem_limit 从 768m 改成 1.5g 的人未必会想到还有一份百分比在 Dockerfile 里。
      #   ⚠️ 更要紧的是【两处都写会静默失效】：JAVA_TOOL_OPTIONS 由 JVM 在解析
      #   命令行之前读入，命令行上的同名参数会覆盖它 —— 于是 Dockerfile 里那个值
      #   会赢，这里写的被悄悄忽略，症状只是"我调了堆怎么没生效"。
      #   ⇒ 口径：镜像保持中立（见 Dockerfile 末尾），随环境变的旋钮全在这里。
      #
      # 每一个参数为什么在（没有一个是"网上抄的标配"）：
      #
      # 【先说清楚这一组参数要一起满足的那条不变式】
      #   下面三个 -XX:*Size* 是【硬上限】，它们之和必须小于 mem_limit：
      #     堆 ~384M（640×60%）+ 元空间 160M + 直接内存 48M = **~592M < 640M**
      #   为什么必须成立：cgroup 的限额是"整进程"的，JVM 自己并不知道
      #   那三个上限加起来会不会越界。只要有可能越界，越界时就是
      #   **内核直接杀容器**（ExitCode 137），Java 层面连一句 OutOfMemoryError
      #   都不会打；守着不变式之后，超限只可能以"某一类内存的 OOM + 一份堆转储"
      #   的形式在应用日志里明确报出来。测试里有一条用例专门盯着这个和
      #   （DeploymentMemoryBudgetTest#backendHardLimitsMustFitInsideMemoryLimit）。
      #   ⚠️ 但要说实话：这 592M 之外只剩 48M 留给 JIT 代码缓存、线程栈与 GC 自身的结构，
      #      而代码缓存实测通常就有 40~50M —— **余量是偏薄的**。
      #      真正兜住的是"这些上限在实际负载下都够用"（堆实际占 300M 上下、
      #      元空间 110M 上下、直接内存十几 M）。万一出现"容器被 OOM 杀、
      #      而堆转储显示堆并没有满"，就把 MaxRAMPercentage 降到 50 再观察。
      #
      #   【⚠️ 这一组参数是【实测】过的，不是照着"最佳实践"抄的】
      #     · 环境：eclipse-temurin:17-jre（与生产镜像同一个基础镜像）
      #     · 命令：docker run --rm --memory <上限> --env-file <本文件里的这一串> ... \
      #             java -XX:+PrintFlagsFinal -version
      #     · 实测结果（在 768m 限制下量的）：MaxHeapSize 正是上限的 60%
      #       （比理论值略高是因为 JVM 会把堆对齐到 G1 的 region 边界）、
      #       MaxMetaspaceSize 与 MaxDirectMemorySize 都生效，
      #       且 gc.log 在目标目录里正常生成（说明 -Xlog 的语法也是对的）。
      #       ⚠️ 上限已经调到 640m，所以那组绝对值对不上现在的数 ——
      #       但"百分比按容器上限算""这几个参数生效""日志能写出来"这三件事与上限无关。
      #   为什么要真的跑一遍：JVM 参数写错的表现是【容器起不来】
      #   （比如 -Xlog 的格式不对，JVM 会直接拒绝启动），
      #   而那是在服务器上才会暴露、且报错信息很不直观的一类问题。
      #
      #   · MaxRAMPercentage=60 —— 堆占容器上限的 60%。留 40% 给堆外：
      #       元空间、线程栈、直接内存、JIT 的代码缓存、GC 自身的结构。
      #       留 40% 而不是常见的 25%，是因为这台机器内存很紧、
      #       上限本身设得就不大，堆外那部分占比会相对更显眼。
      #   · MaxMetaspaceSize=192m —— 元空间默认【无上限】。它装的是类元数据，
      #       正常只有几十 MB；但一旦有类加载器泄漏，它会一路吃下去，
      #       而它吃的是【堆外】内存：结果是容器被 cgroup 杀掉、
      #       Java 层面连一句 OutOfMemoryError 都不会打 —— 这是最难查的一类 OOM。
      #       给个上限，让它变成"堆内可见的 Metaspace OOM + 一份堆转储"。
      #   · MaxDirectMemorySize=64m —— 直接内存（NIO / Tomcat 的 NIO2 连接器
      #       读写缓冲、文件上传）也默认【无上限】：它的默认值是 **MaxHeapSize**，
      #       也就是说不管它的话，这里等于又放开了 461M 的额度，
      #       上面那条"硬上限之和"的不变式立刻不成立。
      #       64M 对本项目是很宽裕的：TLS 在 Nginx 那层就终止了，
      #       后端每个连接的直接缓冲只有 8KB 量级。
      #   · HeapDumpOnOutOfMemoryError + HeapDumpPath=/app/logs ——
      #       出 OOM 时把堆转储下来，事后能看出到底是哪个对象占满了。
      #       路径指向 /app/logs 是【挂过卷】的目录：容器随后会被重启，
      #       写在容器可写层里的话，转储文件和现场一起没了。
      #   · ExitOnOutOfMemoryError —— 走到 OOM 的 JVM 已经不可信
      #       （可能连日志都写不出来、响应畸慢）。直接退出，由
      #       restart: unless-stopped 换一个干净的新进程起来，
      #       比让一个半死的进程继续接请求要好。
      #   · -Xlog:gc* —— 在内存吃紧的机器上，"是不是一直在 GC"是第一个要问的问题。
      #       没有 GC 日志就只能靠猜，而这些日志事后补不出来。
      #       上限 filecount=5 × filesize=10M = 50MB，不会失控。
      #
      # 【⚠️ 刻意【没有】加的，以及为什么】（免得后来的人以为是漏了）
      #   · -Xss512k（调小线程栈）：Linux 上线程栈是【懒提交】的，
      #     改它主要动的是虚拟地址空间，而不是常驻内存 —— 换不来真的内存收益，
      #     却换来"递归深一点就 StackOverflowError"的风险。不加。
      #   · ReservedCodeCacheSize（JIT 代码缓存上限）：它默认预留 240M，
      #     但"预留"占用的是虚拟地址空间，实际提交的只有真正编译出来的那几十 MB，
      #     而且它不像元空间/直接内存那样会被泄漏撑爆。所以不进那条不变式。
      #   · -XX:+UseSerialGC 之类换 GC 的：那是"没实测就调"。
      #     README 里那些性能数字（183ms → 0.11ms、wrk 压测）都是在默认 G1 下量的，
      #     换掉 GC 等于让那些结论失去依据。要换先量。
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=60.0
        -XX:MaxMetaspaceSize=160m
        -XX:MaxDirectMemorySize=48m
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/app/logs
        -XX:+ExitOnOutOfMemoryError
        -Xlog:gc*:file=/app/logs/gc.log:time,uptime,level,tags:filecount=5,filesize=10M

      # 数据库连接池上限。项目里的属性是 ${DB_POOL_SIZE:10}，这里收紧到 6：
      # 每一条 MySQL 连接在服务端都占一个线程和一份排序缓冲，
      # 而本站的并发极低（单人博客），6 条足够，"闲置的连接"没有任何理由留着。
      # 与 mysql 的 --max-connections=50 是配套的：池子 6 条 ≪ 服务端 50 条上限，
      # 于是不会出现"应用把服务端的连接数占满、运维连不进去排查"的情况。
      DB_POOL_SIZE: 6

      # Tomcat 工作线程上限（Spring Boot 的宽松绑定：SERVER_TOMCAT_THREADS_MAX → server.tomcat.threads.max）
      # 默认 200 —— 那是给大内存机器的默认值，为"永远达不到的并发"预留线程没有意义。
      # 【50 这个数不是随手写的】它是"这台机器上真的做过的那一轮压测"的并发量：
      #   README 的 wrk 压测用 -c50（50 个并发连接）直打后端，
      #   所以 50 已经覆盖了已知的最大压力；而正常工作时的并发远低于它 ——
      #   外部请求先到 Nginx、再经前端 SSR（是 SSR 代替浏览器去调后端），
      #   真实用户只有个位数时后端的线程占用也是个位数。
      # 注意它是【上限】不是预留：达不到就不会创建，所以调小它只是收紧最坏情况；
      # 超过 50 的请求会在 accept 队列里排队（默认 100 个位置），而不是被直接拒绝。
      SERVER_TOMCAT_THREADS_MAX: 50
    volumes:
      # 【上传的图片必须放在卷里，这是本文件里最容易被忽略的一处】
      #   不挂卷的话，图片写进容器的可写层：容器一重建就全没了
      #   （镜像重构建、改配置、升级版本都会重建容器）。
      #   具名卷独立于容器存在，"docker compose down"不会删它，
      #   只有加 -v 才会删 —— 这一点在 README 的备份章节也强调了。
      #
      # 【为什么不用"绑定挂载到宿主机目录"】
      #   绑定挂载（./uploads:/app/uploads）也能持久化，而且备份起来更直观；
      #   但它在 Windows/Docker Desktop 上有权限与性能的坑，而具名卷
      #   两个平台行为一致。想直接看到文件的话，用
      #   `docker run --rm -v yiguixingtu-prod_uploads_data:/data -v $PWD:/out alpine cp -r /data /out`
      #   就能把文件拷出来（README 备份章节有这条）。
      - uploads_data:/app/uploads
      # 【日志目录也要挂卷，否则 logback 配的"保留 15 天"是空话】
      #   默认（不挂卷）日志写在容器的可写层里，容器一重建就没了 ——
      #   而"重建"恰恰是我们最需要看历史日志的时候（刚升级完发现不对）。
      #   注意：这个卷【不需要备份】，它只是排查用的；日志总量由 logback 的
      #   maxHistory=15 天 + totalSizeCap=2GB 双重限制，不会无限涨。
      - logs_data:/app/logs
    ports:
      # 应用端口要给 Nginx 反代，所以这一行必须映射 —— 但【只绑到 127.0.0.1】。
      #
      # 【为什么前面要加 "127.0.0.1:"，不能只写 "8082:8082"】
      #   不写前缀时，Docker 会把它绑到 0.0.0.0，也就是【公网也能直连这个端口】。
      #   那意味着两件事：
      #     ① 别人可以绕过 Nginx 直接打后端 —— 限流、访问日志、
      #        HTTPS 全部失效（Nginx 那层根本没参与）；
      #     ② /actuator/prometheus 这个指标端点也一起暴露到公网了
      #        （它在 SecurityConfig 里是放行的，理由见那边的注释）。
      #   而我们的 Nginx 就装在这台宿主机上，反代目标是 127.0.0.1:8082，
      #   所以绑到回环地址对它毫无影响，只是把公网这条路堵掉。
      #   还有一层保险：云服务器上只放行 443/22 的安全组，8082 本来就不开。
      #   两层一起用，是因为"安全组没配错"这件事不该靠记性。
      - "127.0.0.1:${BACKEND_PORT:-8082}:8082"
    healthcheck:
      # 打 actuator 的健康端点，判断"应用真的能干活了"，而不是只看端口开着。
      # -f 让 curl 在收到 4xx/5xx 时返回非 0，健康检查才会正确判定失败
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 启动宽限期给足：Spring 启动 + Flyway 建表 + 管理员引导都要时间
      start_period: 60s
    # 日志轮转：与其它服务共用 x-logging 锚点（上限 10m × 3，见文件顶部说明）
    logging: *default-logging
    restart: unless-stopped

  # -------------------------------------------------------------------
  # 前端（Nuxt 4 SSR）
  #
  # 【为什么前端也放进这个文件，而不是单独一个 compose】
  #   前后端是两个仓库、两个镜像，但上线时它们必须"一起起来、在同一个内网里"，
  #   否则前端容器连不到 backend。
  #   放在同一个 compose 里最省事：一次 up 起全栈，网络由 compose 自动建好，
  #   前端用服务名 backend 就能访问后端，不需要手写网络配置。
  #   （代价：这个文件假设两个仓库是【同级目录】，见下面 context 里的默认值）
  # -------------------------------------------------------------------
  frontend:
    build:
      # 前端仓库的位置。默认按"两个仓库同级"来算（例如
      #   /srv/yiguixingtu 与 /srv/yiguixingtu-web），
      # 不符合时在 .env 里写 FRONTEND_DIR=/你的/实际/路径
      context: ${FRONTEND_DIR:-../yiguixingtu-web}
      dockerfile: Dockerfile
    container_name: yiguixingtu-prod-frontend
    # 内存上限 240M（预算表与理由见文件顶部「内存预算」）。
    # 【为什么这里不配 NODE_OPTIONS=--max-old-space-size】
    #   Node 的运行时（经 libuv）会去读 cgroup 的内存限额，据此定自己的堆上限 ——
    #   所以给出 mem_limit 它就自然按 240M 算。再手工写一个更小的值，
    #   只会把"内存不够"从"容器被限额约束"变成"渲染某个页面时进程直接崩"，
    #   而后者对访问者来说是一个 500 错误，反而更糟。
    mem_limit: 240m
    depends_on:
      # 等后端 healthy 再启动：前端 SSR 渲染首页时可能就要去后端拿数据，
      # 后端没就绪的话首屏会渲染出错误页
      backend:
        condition: service_healthy
    environment:
      # 浏览器用的地址：【必须是对外可访问的地址】。
      # 如果 Nginx 把后端反代在 /api/ 下，这里就填 https://你的域名/api
      NUXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE:?必须在 .env 里设置 PUBLIC_API_BASE（浏览器访问后端的地址）}
      # 服务端渲染用的地址：直连内网的 backend 容器，不走公网/域名。
      # 这正是当初把 apiBase 拆成"服务端 / 浏览器"两份的用处 ——
      # SSR 少绕一圈 DNS + Nginx，也避免了"域名还没配好时 SSR 直接失败"。
      NUXT_API_BASE_SERVER: http://backend:8082
      # 【站点自己的对外域名】canonical、sitemap.xml、robots.txt 里的地址都用它拼。
      #   ⚠️ 为什么必须由这里注入、不能靠前端代码里的默认值：
      #     前端代码里写的默认值是 https://www.yigalaxy.xin（本地开发时够用），
      #     但一旦换域名部署、而这里又没传，产出的 canonical 和 sitemap 会
      #     **安静地指向另一个域名** —— 页面照常能打开，搜索引擎却把权重算到别人家
      #     （或者干脆忽略这份 sitemap）。这属于"不报错但 SEO 全废"的一类问题，
      #     所以刻意用 ${VAR:?} 的写法：没配就直接起不来。
      #   与 PUBLIC_API_BASE 的区别：那个是"后端接口的地址（可能带 /api 前缀）"，
      #   这个是"站点自己（前端页面）的地址"，两者不要混用。
      NUXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?必须在 .env 里设置 PUBLIC_SITE_URL（站点对外域名，例如 https://www.example.com）}
    ports:
      # 前端同样只绑回环：对外只应该有 Nginx 的 443，不该有 3000。
      # 理由和上面后端那段一样，这里不重复。
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      # 镜像里是 alpine + node，没有 curl，所以直接用 node 自带的 fetch 探活。
      # 打首页并检查 HTTP 是否 2xx/3xx —— 只要 SSR 服务活着就会返回
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 日志轮转：与其它服务共用 x-logging 锚点（上限 10m × 3，见文件顶部说明）
    logging: *default-logging
    restart: unless-stopped

volumes:
  # 具名卷：容器删了数据还在（docker compose down 不会删卷，加 -v 才会）
  mysql_data:
  redis_data:
  # 用户上传的封面图（写到这里，见 backend 服务里 UPLOAD_LOCAL_DIR 的说明）
  uploads_data:
  # 应用日志文件（写到这里，见 backend 服务里 LOG_DIR 的说明）
  logs_data:
