# =====================================================================
# 开发环境（dev）—— 本地开发用，也是默认激活的 profile
#
# 【这个文件里只放"和线上不一样"的东西】
#   数据库/Redis 地址、SQL 日志、Swagger —— 这些是本地和线上真正有差异的部分。
#   其余（JWT、Flyway、跨域默认值）都在 application.properties 里。
#
# 【为什么本地也写成明文 root/root 是合理的】
#   这个库是 docker compose 起的、只监听本机，里面也没有真实用户数据。
#   把默认值写在仓库里，别人 clone 下来 `docker compose up -d` 就能直接跑，
#   不需要先配一堆环境变量 —— 这是刻意换来的"开箱即用"。
#   生产环境的凭据则一律走环境变量，见 application-prod.properties。
# =====================================================================

# ---------------- MySQL ----------------
# 端口是 3310 不是 3306：避免和本机上别的项目（3307/3309 等）抢端口
spring.datasource.url=jdbc:mysql://localhost:3310/yiguixingtu?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- Redis ----------------
# 端口是 6380 不是 6379，同样是为了避开本机别的项目
spring.data.redis.host=localhost
spring.data.redis.port=6380

# ---------------- 开发期的便利功能 ----------------
# 把每条 SQL 打印到控制台：本地排查"为什么查不到数据"时最有用的一件工具
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
