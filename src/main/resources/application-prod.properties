# =====================================================================
# 生产环境（prod）—— 部署到服务器时用
#
# 【启用方式】设置环境变量 SPRING_PROFILES_ACTIVE=prod
#   docker compose 里已经写好了（见 docker-compose.yaml 的 backend 服务）。
#
# 【这个文件的核心原则：所有凭据都来自环境变量，一个默认值都不给】
#   数据库密码、Redis 密码、JWT 密钥这些【故意不写默认值】——
#   因为一旦写了默认值，忘记配环境变量时服务会"带着一个公开的默认凭据悄悄跑起来"，
#   这比启动失败危险得多。
#   不写默认值的后果是启动时报
#     Could not resolve placeholder 'DB_PASSWORD'
#   这种"启动就失败"是好事：部署时立刻发现，而不是上线一周后被人拖库。
#
# 【需要准备的环境变量清单】
#   JWT_SECRET            必填，≥32 字节，用于签发 token
#   DB_URL                必填，jdbc:mysql://mysql:3306/yiguixingtu?...
#   DB_USERNAME           必填
#   DB_PASSWORD           必填
#   REDIS_HOST            必填，例如 redis
#   REDIS_PORT            可选，默认 6379
#   REDIS_PASSWORD        必填（内网也建议设，见下）
#   CORS_ALLOWED_ORIGINS  必填，例如 https://your-domain.com
#   SERVER_PORT           可选，默认 8082
#   完整示例见 docker-compose.yaml 与 README 的「部署」章节。
# =====================================================================

# ---------------- MySQL（全部走环境变量） ----------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- Redis ----------------
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
# 【为什么内网也要设密码】Redis 默认无密码，一旦服务器安全组配错、
# 或者容器网络被同宿主机的其它容器访问到，就等于把缓存和业务数据公开了。
# 密码能从环境变量注入，成本几乎为零，没有理由不设。
spring.data.redis.password=${REDIS_PASSWORD}

# ---------------- 生产环境必须关掉的东西 ----------------
# ① 接口文档：Swagger UI 会把全部接口、参数、示例暴露出来，
#    对攻击者来说是一份现成的说明书，线上必须关。
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ② SQL 日志：每条 SQL 都往控制台打，既拖慢响应、又把数据写进日志文件，
#    线上换成"什么都不打"，排错时再临时开。
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
