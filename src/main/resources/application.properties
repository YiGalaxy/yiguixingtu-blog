# =====================================================================
# 公共配置（所有环境共用）
#
# 【Spring Boot 的配置文件是怎么叠加的】
#   启动时先读 application.properties（本文件），再按激活的 profile
#   叠加 application-{profile}.properties。
#   后面的会覆盖前面的同名项 —— 所以"所有环境都一样的东西"放这里，
#   "各环境不同的东西"（数据库地址、SQL 日志、Swagger 开关）放 profile 文件。
#
# 【怎么切换环境】
#   默认是 dev（见下面 spring.profiles.active）。
#   线上用环境变量覆盖：SPRING_PROFILES_ACTIVE=prod
#   （操作系统环境变量的优先级高于配置文件，所以既不用改文件、也不用重新打包）
#   这就是常说的"打包一次、处处运行"（build once, run anywhere）。
# =====================================================================
spring.application.name=yiguixingtu

# 服务端口：线上用 SERVER_PORT 覆盖
server.port=${SERVER_PORT:8082}

# 默认激活 dev；线上用 SPRING_PROFILES_ACTIVE=prod 覆盖
spring.profiles.active=dev

# ==================== MyBatis-Plus（各环境一致） ====================
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.yigalaxy.yiguixingtu.**.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto

# ==================== JWT ====================
# ⚠️ 生产环境【必须】用 JWT_SECRET 环境变量覆盖这个默认值。
#    任何人拿到这个密钥都能伪造出合法的 token。
jwt.secret=${JWT_SECRET:nr7j55m-oPN4-4FmtRY3OsMW6xQLJFuqsGFux7vqwSI}
# token 有效期，单位毫秒，默认 1 天
jwt.expire-time=${JWT_EXPIRE_TIME:86400000}

# ==================== Flyway 数据库迁移 ====================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Flyway 基线：本地的库是先手工建好表、Flyway 才接进来的，属于"已存在的非空库"。
# 开启后会给它打一个基线标记、不再重复执行 V1；
# 而全新的空库（Testcontainers 容器、部署时的生产库）没有标记，V1 会正常执行。
# 两种情形共用同一份配置，不需要分环境改。
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ==================== 跨域白名单 ====================
# 【为什么这一项必须变成可配置】原来写死在 SecurityConfig 里（http://localhost:3000），
# 一上线换成域名就会跨域失败，而且改完还得重新打包。
# 现在从配置读，多个来源用英文逗号分隔：
#   CORS_ALLOWED_ORIGINS=https://blog.example.com,https://www.blog.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ==================== 文件上传 ====================
# 存储方式：local（本地磁盘，默认）/ oss（阿里云 OSS，生产用）
app.upload.storage=${UPLOAD_STORAGE:local}
# 本地存储的目录与访问地址前缀（storage=local 时生效）
app.upload.local-dir=${UPLOAD_LOCAL_DIR:./uploads}
app.upload.base-url=${UPLOAD_BASE_URL:http://localhost:8082}
# 允许的图片格式白名单（黑名单永远列不全，白名单才是安全默认值）
app.upload.allowed-extensions=jpg,jpeg,png,gif,webp
# 单文件上限 5MB。注意下面 multipart 的两项要【同步调整】，否则请求会在框架层被拒，
# 报出来的错与业务无关、用户也看不懂
app.upload.max-size=5MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ==================== 对象存储（storage=oss 时才需要） ====================
# ⚠️ 必须用 RAM 子账号的密钥，并只授权这一个 Bucket 的读写；
#    不要用主账号 AccessKey（它等于整个账号的权限）
app.upload.oss-endpoint=${OSS_ENDPOINT:}
app.upload.oss-bucket=${OSS_BUCKET:}
app.upload.oss-access-key-id=${OSS_ACCESS_KEY_ID:}
app.upload.oss-access-key-secret=${OSS_ACCESS_KEY_SECRET:}
app.upload.oss-key-prefix=${OSS_KEY_PREFIX:cover}
# 博客封面是公开内容 → 默认公有读；Bucket 是私有时改成 true 走签名 URL
app.upload.oss-signed-url=${OSS_SIGNED_URL:false}

# ==================== 链路追踪（traceId） ====================
# 采样率 1.0 = 每个请求都记。本项目是个人博客、流量小，
# 全采样才能保证"用户报错时一定能拿到 traceId"；
# 高流量系统才会把它调低（比如 0.1）来省开销。
management.tracing.sampling.probability=1.0
# 传播格式用 B3。
# 【说清楚它的真实作用 —— 第一版注释写错了】
#   一开始以为设了 b3 之后响应头会自动带 X-B3-TraceId，实测【不会】：
#   Boot 4 把 tracing 的 receiver/sender/default 三个 handler 包进了
#   FirstMatchingCompositeObservationHandler，入站请求永远先被 receiver 匹配，
#   负责写响应头的 sender 轮不到执行（详见 TraceResponseHeaderFilter 的类注释）。
#   所以给前端的 traceId 是那个过滤器写的自定义头 X-Trace-Id，跟这里无关。
#   这里 propagation.type 真正管的是【接收端】：收到带 B3 头（X-B3-TraceId）的
#   上游请求时，继续那条 trace 而不是另起一条 —— 保留它是为了将来接入
#   网关/消息链路时能串起来，现在改了它也没有可见影响。
management.tracing.propagation.type=b3

# ==================== 文章浏览量异步落库 ====================
# Redis 里累计的浏览量，多久批量写回数据库一次（毫秒），默认 5 分钟。
# 详情页只做一次 Redis INCR（内存操作、无行锁），由 ViewCountSyncTask 定期落库，
# 从而把"读接口里的写操作"从请求链路里挪走。
# 调小 → 落库更及时、但写库次数变多；调大 → 相反。
app.article.view-sync-interval-ms=${ARTICLE_VIEW_SYNC_INTERVAL_MS:300000}

# ==================== 健康检查与指标（容器探针 + Prometheus 要用） ====================
# 只暴露 health 与 prometheus 这两个端点：
#   · health     —— 容器健康检查、负载均衡探活靠它
#   · prometheus —— 指标抓取（见 README「可观测」章节）
# 其余端点（beans / env / mappings / heapdump ...）会把内部结构甚至内存内容暴露出去，
# 一律不开 —— 默认只开 health，这里是我们【显式】多开了一个，不是"忘了关"。
management.endpoints.web.exposure.include=health,prometheus
# 只返回 {"status":"UP"}，不带数据库/Redis 的细节 ——
# 因为这个端点是匿名可访问的（容器探针不带 token），细节不该对匿名者公开
management.endpoint.health.show-details=never

# 【下面是刻意没有写的两条，记下来免得以后有人"补上"】
#   management.metrics.web.server.max-uri-tags=100
#     它的默认值就是 100，作用是限制 http_server_requests_seconds 里
#     uri 这个标签最多出现 100 个不同的值（超过的会被丢弃）。
#     这一条很重要 —— 不加限制的话，每个文章 ID 都会变成一个独立的 uri 标签，
#     指标条数随文章数无限增长，把 Prometheus 的存储撑爆。
#     这叫"标签基数爆炸"，是引入指标时最容易犯、代价最大的错误。
#     之所以不写出来：写一个和默认值相同的配置，只会让人以为"这是我们特意调过的"。
#   management.observations.http.server.requests.name=http.server.requests
#     同样是默认值。接口耗时指标的采集依赖 Observation（观测）这套机制，
#     而本项目正好在链路追踪那件事上怀疑 Observation 没生效
#     （见 TECH_ROADMAP §9 M5 的 5.1 卡点）。
#     所以这里不靠"配了一条属性"来证明它开着，而是靠 MetricsEndpointTest
#     去断言指标真的出现在 /actuator/prometheus 里 —— 看得见的证据才算证据。

# ==================== 管理员初始化引导 ====================
# 【为什么需要它】注册接口只产出 GUEST，而"提升角色"的接口本身要求调用者是 ADMIN，
# 所以全新数据库里没有任何管理员时，后台是【进不去】的。
# 应用启动时会检查：库里没有可用的管理员 → 按下面两项建出一个（幂等，已有管理员就跳过）。
# 留空 = 不启用引导（本地开发不需要，因为本地库里已经有管理员了）。
# 生产环境务必设置（见 README 的「怎么得到第一个管理员账号」）：
#   BOOTSTRAP_ADMIN_USERNAME=你的账号
#   BOOTSTRAP_ADMIN_PASSWORD=一个强密码
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.nickname=${BOOTSTRAP_ADMIN_NICKNAME:站长}

# ==================== 接口文档（Swagger） ====================
# 默认开着方便本地开发；prod 里会关掉（见 application-prod.properties）
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
