# 应用名
spring.application.name=yiguixingtu
# 服务端口
server.port=8082
#MySQL数据源
spring.datasource.url=jdbc:mysql://localhost:3310/yiguixingtu?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#Redis配置
spring.data.redis.host=localhost
spring.data.redis.port=6380
#MyBatis-Plus配置
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.yigalaxy.yiguixingtu.**.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
#JWT配置
jwt.secret=${JWT_SECRET:nr7j55m-oPN4-4FmtRY3OsMW6xQLJFuqsGFux7vqwSI}
jwt.expire-time=${JWT_EXPIRE_TIME:86400000}
#Flyway数据库迁移配置
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
#Flyway基线：本地的库是先手工建好表、Flyway 才接进来的，属于"已存在的非空库"。
#开启后会给它打一个基线标记、不再重复执行 V1；
#而全新的空库（Testcontainers 容器、部署时的生产库）没有标记，V1 会正常执行。
#两种情形共用同一份配置，不需要分环境改。
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
