# =====================================================================
# 公共配置（所有环境共用）
#
# 【Spring Boot 的配置文件是怎么叠加的】
#   启动时先读 application.properties（本文件），再按激活的 profile
#   叠加 application-{profile}.properties。
#   后面的会覆盖前面的同名项 —— 所以"所有环境都一样的东西"放这里，
#   "各环境不同的东西"（数据库地址、SQL 日志、Swagger 开关）放 profile 文件。
#
# 【怎么切换环境】
#   默认是 dev（见下面 spring.profiles.active）。
#   线上用环境变量覆盖：SPRING_PROFILES_ACTIVE=prod
#   （操作系统环境变量的优先级高于配置文件，所以既不用改文件、也不用重新打包）
#   这就是常说的"打包一次、处处运行"（build once, run anywhere）。
# =====================================================================
spring.application.name=yiguixingtu

# 服务端口：线上用 SERVER_PORT 覆盖
server.port=${SERVER_PORT:8082}

# 默认激活 dev；线上用 SPRING_PROFILES_ACTIVE=prod 覆盖
spring.profiles.active=dev

# ==================== MyBatis-Plus（各环境一致） ====================
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.yigalaxy.yiguixingtu.**.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto

# ==================== JWT ====================
# ⚠️ 生产环境【必须】用 JWT_SECRET 环境变量覆盖这个默认值。
#    任何人拿到这个密钥都能伪造出合法的 token。
jwt.secret=${JWT_SECRET:nr7j55m-oPN4-4FmtRY3OsMW6xQLJFuqsGFux7vqwSI}
# token 有效期，单位毫秒，默认 1 天
jwt.expire-time=${JWT_EXPIRE_TIME:86400000}

# ==================== Flyway 数据库迁移 ====================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Flyway 基线：本地的库是先手工建好表、Flyway 才接进来的，属于"已存在的非空库"。
# 开启后会给它打一个基线标记、不再重复执行 V1；
# 而全新的空库（Testcontainers 容器、部署时的生产库）没有标记，V1 会正常执行。
# 两种情形共用同一份配置，不需要分环境改。
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ==================== 跨域白名单 ====================
# 【为什么这一项必须变成可配置】原来写死在 SecurityConfig 里（http://localhost:3000），
# 一上线换成域名就会跨域失败，而且改完还得重新打包。
# 现在从配置读，多个来源用英文逗号分隔：
#   CORS_ALLOWED_ORIGINS=https://blog.example.com,https://www.blog.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ==================== 文件上传 ====================
# 【封面图存在这台服务器自己的磁盘上，不用对象存储】
#   为什么：单台 ECS + 个人博客的图片量级，本地磁盘完全够用，
#   少一个外部依赖就少一处会失败的地方（网络、密钥过期、配额、还多付一份钱）。
#   项目早期那套 OSS 实现（storage 开关 + OssFileStorage + 一堆 oss-* 配置）
#   已经连同依赖一起删掉了 —— 留一套没人走过、CI 也验证不了的代码路径不是扩展性，是负担。
#   将来真要上对象存储（图片多到磁盘吃紧、或者要上多台机器），
#   做法是"实现 FileStorage 接口 + 加它自己的配置项"，UploadService 不用改。
#
# 【线上必须把 local-dir 指到挂载点里】见 docker-compose.prod.yaml 的说明：
#   写到容器自己的可写层，容器一重建图片就全丢了，而且没有任何报错
app.upload.local-dir=${UPLOAD_LOCAL_DIR:./uploads}
# 图片对外地址前缀：必须填【浏览器能访问到"后端 /uploads/**"】的那个地址，
# 因为它会被拼进 URL 存进文章表直接展示给浏览器。
# 本地是 http://localhost:8082；线上是 https://域名/api（Nginx 把 /api/ 反代到后端根路径）
app.upload.base-url=${UPLOAD_BASE_URL:http://localhost:8082}
# 允许的图片格式白名单（黑名单永远列不全，白名单才是安全默认值）
app.upload.allowed-extensions=jpg,jpeg,png,gif,webp
# 存储路径前缀，真正的路径形如 cover/2026/09/{uuid}.jpg
app.upload.key-prefix=${UPLOAD_KEY_PREFIX:cover}
# 单文件上限 5MB。注意下面 multipart 的两项要【同步调整】，否则请求会在框架层被拒，
# 报出来的错与业务无关、用户也看不懂
app.upload.max-size=5MB
#
# ---- 音频（POST /upload?type=audio）----
# 【为什么另起三项，而不是把 mp3 加进上面的白名单、上限改成 20MB】
#   那是两行就能改完的做法，但它会【悄悄放宽图片的规则】：图片从此能传 20MB、
#   也能传 mp3，而且不会有任何报错。这两条各有一条用例钉着（UploadAdminTest ⑭ ⑮，⑰ 证上限也分流），
#   完整推导见 upload/UploadType 的类注释。
# 音频格式白名单：只放行 mp3（不加 wav/flac 的理由见 UploadProperties.audioAllowedExtensions）
app.upload.audio-allowed-extensions=mp3
# 音频上限 20MB。依据：主流高质量档约 320kbps（40KB/s），一首 5 分钟的歌约 12MB，
# 20MB 足以覆盖 320kbps 下 8 分钟以内的曲目（算法见 UploadProperties.audioMaxSize）
app.upload.audio-max-size=20MB
# 音频的存储目录前缀：真实的路径形如 music/2026/09/{uuid}.mp3 → 访问地址 /uploads/music/...
# 与图片的 cover/ 分开（生命周期、体积、清理策略都不同）
app.upload.audio-key-prefix=${UPLOAD_AUDIO_KEY_PREFIX:music}
#
# 【multipart 的限额必须按"最大的那一类"设，业务层再按类型细分】
#   框架层的 max-file-size 是"请求能不能进来"的闸门：超过它请求【根本走不到业务代码】，
#   报出来的是一个和业务无关的框架异常。所以这里按音频的 20MB 兜底；
#   而"图片只能 5MB"这条规则由 UploadService 按 type 判断
#   —— 框架层管请求，业务层管"这一类允许多大"，两层各管一段，不会互相漏。
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ==================== 链路追踪（traceId） ====================
# 采样率 1.0 = 每个请求都记。本项目是个人博客、流量小，
# 全采样才能保证"用户报错时一定能拿到 traceId"；
# 高流量系统才会把它调低（比如 0.1）来省开销。
management.tracing.sampling.probability=1.0
# 传播格式用 B3。
# 【说清楚它的真实作用 —— 第一版注释写错了】
#   一开始以为设了 b3 之后响应头会自动带 X-B3-TraceId，实测【不会】：
#   Boot 4 把 tracing 的 receiver/sender/default 三个 handler 包进了
#   FirstMatchingCompositeObservationHandler，入站请求永远先被 receiver 匹配，
#   负责写响应头的 sender 轮不到执行（详见 TraceResponseHeaderFilter 的类注释）。
#   所以给前端的 traceId 是那个过滤器写的自定义头 X-Trace-Id，跟这里无关。
#   这里 propagation.type 真正管的是【接收端】：收到带 B3 头（X-B3-TraceId）的
#   上游请求时，继续那条 trace 而不是另起一条 —— 保留它是为了将来接入
#   网关/消息链路时能串起来，现在改了它也没有可见影响。
management.tracing.propagation.type=b3

# ==================== 数据库连接池（HikariCP） ====================
# 【先说结论：这几个值不是抄来的，是"算一遍 + 量一遍"之后定的】
#
# maximum-pool-size：默认 10
#   · 算法依据：HikariCP 官方文档给的公式是
#        连接数 ≈ CPU 核数 × 2 + 磁盘数
#     一台 2~4 核的 ECS 算下来就是 5~9，取 10 是个安全的整数值。
#   · 实测依据（wrk 打 /article/page，10 万行数据）：
#        池 = 10，50 并发 → 623 req/s，P50 72ms
#        池 = 20，50 并发 → 见 README「性能」章节的对比表
#     两种池大小的【吞吐几乎一样】—— 说明瓶颈在数据库那侧，不在连接数。
#     把池开得比这还大只会让更多请求在数据库里排队，反而增加上下文切换。
#   · 为什么做成可配置：ECS 的规格是会变的，换个 8 核机器这个值就该跟着调。
#     DB_POOL_SIZE 环境变量可以覆盖，不用改代码重新打包。
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
# minimum-idle 设成和 maximum 一样：让连接【一直是热的】。
# 如果它比 maximum 小，空闲连接会被回收、来请求时再新建 ——
# 而建一条 MySQL 连接要握手 + 认证，是毫秒级开销。
# 个人博客的流量是"一阵一阵"的（有人访问就几个请求），
# 这种场景下频繁建连的代价比多留几个空闲连接大得多。
spring.datasource.hikari.minimum-idle=${DB_POOL_SIZE:10}
# connection-timeout：从池里拿不到连接时最多等多久（毫秒）。
# Hikari 默认是 30 秒 —— 那意味着数据库出问题时，
# 一个请求要挂 30 秒才报错，用户早就关掉页面了，
# 而且这 30 秒里它一直占着 Tomcat 的工作线程，把线程池也拖满。
# 3 秒足够覆盖正常的排队（上面实测 P99 才 135ms），
# 超过 3 秒还没轮到，说明已经不正常了，应该立刻失败并暴露出来。
spring.datasource.hikari.connection-timeout=3000
# max-lifetime：一条连接最多活多久（毫秒），默认 30 分钟，这里显式写出来。
# 【为什么必须显式管这个】MySQL 那侧有个 wait_timeout（默认 28800 秒 = 8 小时），
# 超过就被服务端单方面关掉。如果连接池里的连接活得比它久，
# 池子会拿着一条"其实已经死了"的连接去用，报出来的是
# "Communications link failure" —— 一个和真实原因毫无关系的错。
# 30 分钟 ≪ 8 小时，安全。将来若调小 MySQL 的 wait_timeout，
# 这个值必须跟着一起调小（这也是把它写在配置文件里、而不是靠默认值的原因）。
spring.datasource.hikari.max-lifetime=1800000

# ==================== 接口限流（Resilience4j） ====================
#
# 【为什么应用层还要限流 —— Nginx 不是已经限了吗】
#   两层的职责完全不同，是【互补】而不是重复：
#
#   | | Nginx 的 limit_req | 应用层 Resilience4j |
#   |---|---|---|
#   | 按什么限 | **按客户端 IP**（$binary_remote_addr） | **按接口的全局配额** |
#   | 挡住的是谁 | 单个 IP 的疯狂刷接口 | 所有来源加起来把某个接口刷爆 |
#   | 保护的是谁 | 后端进程本身 | **后面的数据库和 Redis** |
#
#   举两个各自挡不住的例子就清楚了：
#     · 攻击者用几千个代理 IP、每个只请求几次 → Nginx 的按 IP 限制会全部放行，
#       但总流量足以把数据库打满 → 这种情况靠应用层的全局配额兜住
#     · 正常用户把某个接口的全局配额用满了 → 应用层会拒绝更多人，
#       而 Nginx 那层至少保证"每个 IP 只能占一小部分"，不会让一个人独吞
#
# 【⚠️ 一个必须说清楚的事实：应用层的限流是"全局"的，不是"按人"的】
#   Resilience4j 的 RateLimiter 是进程级的一个计数器，它不知道请求来自谁。
#   所以下面的数字含义是"整个站点在这个接口上每分钟最多放过去多少次"。
#   要做到"每个用户/每个 IP 各有配额"，那是 Nginx 那层的职责（只有它知道 IP），
#   或者要自己在限流键里带上用户标识（本项目的量级不需要）。
#   写清楚这一点，是为了避免"以为已经给每个用户都限了流"这种误解。
#
# 【关于 timeout-duration = 0】
#   配额用完时，请求可以选"等一会儿"或"立刻拒绝"。这里选立刻拒绝（0）：
#   限流的目的是保护后端，让请求排队只会把压力从数据库转成 Tomcat 线程堆积，
#   最后一起雪崩。要"削峰填谷"的话那是消息队列该干的事，不是限流。

# ---- 登录接口：5 次 / 分钟 ----
# 【为什么登录要单独限、而且额度给得这么小】
#   登录是唯一一个"可以被反复尝试、猜对了就有收益"的公开接口 ——
#   也就是暴力破解的入口。给一个很小的全局配额，能让脚本爆破彻底失去意义：
#   一分钟只放 5 次，猜中一个强密码的概率可以忽略。
#   正常用户不会一分钟登录 5 次以上，对真实使用几乎没有影响。
resilience4j.ratelimiter.instances.loginRateLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.loginRateLimiter.limit-refresh-period=1m
resilience4j.ratelimiter.instances.loginRateLimiter.timeout-duration=0

# ---- 前台文章列表：300 次 / 分钟 ----
# 【为什么这个额度给得大】
#   它是全站最热的读接口，而且是公开的：首页、分类页、搜索都打它。
#   缓存命中时它的成本很低，所以限额可以宽松；但再宽松也得有上限 ——
#   万一缓存被穿透（有人拿随机关键词刷），请求会全落到数据库上，
#   这一层就是防止"缓存失效 + 高频访问"把数据库打死的那道闸。
#   300/分钟 ≈ 5 QPS，对个人博客的正常访问绰绰有余。
resilience4j.ratelimiter.instances.articlePageRateLimiter.limit-for-period=300
resilience4j.ratelimiter.instances.articlePageRateLimiter.limit-refresh-period=1m
resilience4j.ratelimiter.instances.articlePageRateLimiter.timeout-duration=0

# ---- 发表评论：20 次 / 分钟 ----
# 【为什么评论也要限流，而且额度比列表小得多】
#   评论是全站唯一一个【任何人都能往数据库写内容】的接口，
#   也是垃圾评论机器人最爱的目标（它们会直接按接口打，不走页面）。
#   20/分钟对正常读者绰绰有余（没有人一分钟能写 20 条评论），
#   但足以让"脚本一分钟灌几百条"这种事变成"几乎灌不进去"。
#   ⚠️ 这是【整站】配额，不是按 IP 的 —— 按 IP 的限制在 Nginx 那层，
#      两层叠加才是完整的防线（理由见上面那段"为什么两层都要"）。
#   另外这只是第二道闸：真正的第一道是"评论默认待审核，不通过就不对外可见"。
resilience4j.ratelimiter.instances.commentRateLimiter.limit-for-period=20
resilience4j.ratelimiter.instances.commentRateLimiter.limit-refresh-period=1m
resilience4j.ratelimiter.instances.commentRateLimiter.timeout-duration=0

# 被拒时抛出的 RequestNotPermitted 由 GlobalExceptionHandler 翻译成
# HTTP 429 + {"code":429}（见该类 handleRateLimited 的注释，那里解释了
# 为什么这一类返回真实状态码，而业务错误仍保持 200 + body.code）

# ==================== 异步执行线程池（@Async 用，目前只有操作审计） ====================
# 【为什么队列容量必须是【有界】的 —— 这是本段最重要的一条】
#   线程池的队列如果无界（Integer.MAX_VALUE），任务就会无限堆积：
#   数据库慢一点，任务进队列的速度大于消费速度，队列越来越长，
#   最终把内存吃光 —— 表现是"应用莫名其妙 OOM"，而且看不出跟审计有关。
#   有界队列的意义是：压力大的时候【明确地拒绝】，而不是悄悄地攒。
#   200 对"每分钟几十次后台写操作"来说绰绰有余；就算短时间被并发写爆，
#   200 个待处理任务也只占很小的内存。
spring.task.execution.pool.queue-capacity=200
# 核心线程 1 个：审计是低频率、低优先级的写入，一个线程足够，
# 多开线程反而会跟业务请求抢数据库连接。
spring.task.execution.pool.core-size=1
# 最大 4 个：只在队列快满时临时扩容，属于"应急"而不是常态
spring.task.execution.pool.max-size=4
spring.task.execution.pool.keep-alive=60s
# 让核心线程也会超时回收：低峰期不必一直占着一个线程
spring.task.execution.pool.allow-core-thread-timeout=true
# 线程名前缀：日志里一眼就能分辨"这条是异步审计线程打的"，
# 排查问题时能立刻看出"这行日志不在处理请求的那个线程上"
spring.task.execution.thread-name-prefix=audit-async-
# 关停时等未完成的任务做完：审计记录不该因为一次重启就丢
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=10s

# ⚠️ 队列满时的拒绝策略配不了（Boot 没暴露这个配置项），
#    用 config/AsyncConfig 里的 ThreadPoolTaskExecutorCustomizer 设成了
#    CallerRunsPolicy —— 为什么必须是它，见那个类的注释。

# ==================== 文章浏览量异步落库 ====================
# Redis 里累计的浏览量，多久批量写回数据库一次（毫秒），默认 5 分钟。
# 详情页只做一次 Redis INCR（内存操作、无行锁），由 ViewCountSyncTask 定期落库，
# 从而把"读接口里的写操作"从请求链路里挪走。
# 调小 → 落库更及时、但写库次数变多；调大 → 相反。
app.article.view-sync-interval-ms=${ARTICLE_VIEW_SYNC_INTERVAL_MS:300000}

# ==================== 健康检查与指标（容器探针 + Prometheus 要用） ====================
# 只暴露 health 与 prometheus 这两个端点：
#   · health     —— 容器健康检查、负载均衡探活靠它
#   · prometheus —— 指标抓取（见 README「可观测」章节）
# 其余端点（beans / env / mappings / heapdump ...）会把内部结构甚至内存内容暴露出去，
# 一律不开 —— 默认只开 health，这里是我们【显式】多开了一个，不是"忘了关"。
management.endpoints.web.exposure.include=health,prometheus
# 只返回 {"status":"UP"}，不带数据库/Redis 的细节 ——
# 因为这个端点是匿名可访问的（容器探针不带 token），细节不该对匿名者公开
management.endpoint.health.show-details=never

# 【下面是刻意没有写的两条，记下来免得以后有人"补上"】
#   management.metrics.web.server.max-uri-tags=100
#     它的默认值就是 100，作用是限制 http_server_requests_seconds 里
#     uri 这个标签最多出现 100 个不同的值（超过的会被丢弃）。
#     这一条很重要 —— 不加限制的话，每个文章 ID 都会变成一个独立的 uri 标签，
#     指标条数随文章数无限增长，把 Prometheus 的存储撑爆。
#     这叫"标签基数爆炸"，是引入指标时最容易犯、代价最大的错误。
#     之所以不写出来：写一个和默认值相同的配置，只会让人以为"这是我们特意调过的"。
#   management.observations.http.server.requests.name=http.server.requests
#     同样是默认值。接口耗时指标的采集依赖 Observation（观测）这套机制，
#     而本项目正好在链路追踪那件事上怀疑 Observation 没生效
#     （见 TECH_ROADMAP §9 M5 的 5.1 卡点）。
#     所以这里不靠"配了一条属性"来证明它开着，而是靠 MetricsEndpointTest
#     去断言指标真的出现在 /actuator/prometheus 里 —— 看得见的证据才算证据。

# ==================== 管理员初始化引导 ====================
# 【为什么需要它】注册接口只产出 GUEST，而"提升角色"的接口本身要求调用者是 ADMIN，
# 所以全新数据库里没有任何管理员时，后台是【进不去】的。
# 应用启动时会检查：库里没有可用的管理员 → 按下面两项建出一个（幂等，已有管理员就跳过）。
# 留空 = 不启用引导（本地开发不需要，因为本地库里已经有管理员了）。
# 生产环境务必设置（见 README 的「怎么得到第一个管理员账号」）：
#   BOOTSTRAP_ADMIN_USERNAME=你的账号
#   BOOTSTRAP_ADMIN_PASSWORD=一个强密码
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.nickname=${BOOTSTRAP_ADMIN_NICKNAME:站长}

# ==================== 接口文档（Swagger） ====================
# 默认开着方便本地开发；prod 里会关掉（见 application-prod.properties）
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
